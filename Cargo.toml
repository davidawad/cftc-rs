[package]
name = "cftc-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Query free public swap data (DTCC PPD: CFTC Part 43 and SEC Reg SBSR) as typed records over any date range, with CDS aggregates"
license = "GPL-3.0-or-later"
repository = "https://github.com/davidawad/cftc-rs"
readme = "README.md"
keywords = ["cds", "swaps", "cftc", "dtcc", "credit"]
categories = ["finance", "parser-implementations", "command-line-utilities"]

[lib]
name = "cftc"
path = "src/lib.rs"

[[bin]]
name = "cftc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
csv = "1.3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
